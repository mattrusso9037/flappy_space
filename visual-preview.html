<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Flappy Spaceman visual QA</title>
  </head>
  <body>
    <nav aria-label="Visual QA controls">
      <label for="level-select">LEVEL</label>
      <select id="level-select" aria-label="Select Level"></select>
      <button id="load-level">Load Level</button>
      <button id="scene">Scene</button>
      <button id="thrust">Thrust</button>
      <button id="collection">Collection</button>
      <button id="warp">Warp</button>
      <button id="impact">Impact</button>
      <button id="step">Step 100ms</button>
      <button id="play">Play</button>
      <button id="pause">Pause</button>
      <output id="status">Loading</output>
    </nav>
    <main id="preview"></main>
    <script type="module" src="/src/test/visual-preview.ts"></script>
  </body>
</html>
